[package]
name = "burnless-engine"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Reads local Claude Code and Codex usage through ccusage and prints a versioned JSON report for Burnless."

[[bin]]
name = "burnless-engine"
path = "src/main.rs"

# ccusage is the data foundation. Pinned to an exact revision so parsing,
# deduplication and pricing behavior only change on an explicit bump.
[dependencies]
ccusage-core = { git = "https://github.com/ccusage/ccusage", rev = "57e5658dcac4de42f50d059b62cddc1fec9bbdc9" }
ccusage-adapter-claude = { git = "https://github.com/ccusage/ccusage", rev = "57e5658dcac4de42f50d059b62cddc1fec9bbdc9" }
ccusage-adapter-codex = { git = "https://github.com/ccusage/ccusage", rev = "57e5658dcac4de42f50d059b62cddc1fec9bbdc9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
